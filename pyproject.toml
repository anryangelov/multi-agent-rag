[project]
name = "multi-agent-rag"
version = "0.1.0"
description = "A simulated multi-agent RAG system over the internal documentation of a fictional bank's automation platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "model2vec>=0.10.0",
    "numpy>=2.5.4",
    "pydantic>=2",
    "pydantic-ai-slim[anthropic,openai]>=2.62.0",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The notebook's first cell puts the repository on sys.path before importing it.
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["eval: LLM evals; run only when a model key is configured"]
