# Gold set for the offline evals.
#
# Each question lists the domains the classifier should pick and the
# documents retrieval should return. For an authority conflict both sides
# are expected: the system has to find both before it can decide between
# them. A superseded version is not searched (it is in
# `forbidden_documents`) unless the question asks about history
# (`include_superseded: true`).
# `clearance` is the access level of the person asking (default: internal).
#
# Questions 1-12 drive the spikes; the full set grows from them.
# Expected answer facts and conflict winners are added later.

- id: Q01
  purpose: test scenario 1 from the assignment
  question: >-
    What's the process for deploying a new microservice and what compliance
    checks are needed?
  expected_domains: [technical, compliance]
  expected_documents: [TEC-1, TEC-3, CMP-4]

- id: Q02
  purpose: test scenario 2 from the assignment
  question: >-
    How do I troubleshoot API performance issues while following our
    security policies?
  expected_domains: [technical, compliance]
  expected_documents: [TEC-4, TEC-6, CMP-5]

- id: Q03
  purpose: test scenario 3 from the assignment
  question: >-
    What business approvals are required for implementing a new data
    processing workflow?
  expected_domains: [business, compliance]
  expected_documents: [BUS-2, CMP-1, CMP-2, CMP-6]

- id: Q04
  purpose: versions (conflict 1), paraphrased; only the version in force
  question: Is one sign-off enough to ship a change to production?
  expected_domains: [technical]
  expected_documents: [TEC-3]
  forbidden_documents: [TEC-2]

- id: Q05
  purpose: versions (conflict 2), paraphrased; only the version in force
  question: Who must agree before we automate a process that touches customer data?
  expected_domains: [business]
  expected_documents: [BUS-2]
  forbidden_documents: [BUS-1]

- id: Q06
  purpose: conflict 3 (authority, across domains), paraphrased
  question: How long can we keep the troubleshooting logs of an API?
  expected_domains: [technical, compliance]
  expected_documents: [CMP-3, TEC-4]

- id: Q07
  purpose: conflict 4 (authority), literal
  question: Can an experimental connector run in production?
  expected_domains: [business]
  expected_documents: [BUS-3, BUS-4]

- id: Q08
  purpose: conflict 5 (authority, across domains), paraphrased
  question: Can my team reuse a connector that another department built?
  expected_domains: [technical, business]
  expected_documents: [BUS-3, TEC-5]

- id: Q09
  purpose: the two confidential documents, asked with confidential clearance
  question: Why was the complaint summarisation workflow paused?
  clearance: confidential
  expected_domains: [business, compliance]
  expected_documents: [CMP-8, BUS-8]

- id: Q10
  purpose: paraphrase only, no keyword from the document title
  question: What should I do if the platform goes down in the middle of the night?
  expected_domains: [technical]
  expected_documents: [TEC-7]

- id: Q11
  purpose: a fact buried in a long unstructured document (meeting minutes)
  question: Did the board agree to pay for a second robot for sanctions screening?
  expected_domains: [business]
  expected_documents: [BUS-9]

- id: Q12
  purpose: a fact buried in a long unstructured document (incident review)
  question: Why did sanctions alert screening fall hours behind at the end of August?
  expected_domains: [technical]
  expected_documents: [TEC-9]

- id: Q13
  purpose: history; the superseded version answers it
  question: How many approvers did a production release need in 2025?
  include_superseded: true
  expected_domains: [technical]
  expected_documents: [TEC-2]

- id: Q14
  purpose: what changed between versions, answered by the version in force
  question: What changed in the rules for approving a new automated process?
  expected_domains: [business]
  expected_documents: [BUS-2]
  forbidden_documents: [BUS-1]

- id: Q15
  purpose: >-
    conflict 6 (same kind, two guides), paraphrased; decided by evidence:
    TEC-3 refers the rollback of a workflow to BUS-7, so BUS-7 wins although
    BUS-4 is newer
  question: >-
    If a new version of our automation misbehaves, can the process owner
    switch back to the old one without asking anyone?
  expected_domains: [business]
  expected_documents: [BUS-4, BUS-7]

- id: Q16
  purpose: >-
    conflict 7 (same kind, two standards, across domains), paraphrased; no
    other document supports either side, so there is no winner
  question: Can the analyst who built a workflow look at its audit records?
  expected_domains: [business, compliance]
  expected_documents: [BUS-6, CMP-7]
