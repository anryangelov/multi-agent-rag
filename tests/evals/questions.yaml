- id: Q13
  purpose: history; the superseded version answers it
  question: How many approvers did a production release need in 2025?
  include_superseded: true
  paraphrase: In 2025, how many sign-offs did a release to production require?
  expected_domains: [technical]
  expected_documents: [TEC-2]
  expected_facts: [one approver]

- id: Q14
  purpose: what changed between versions, answered by the version in force
  question: What changed in the rules for approving a new automated process?
  paraphrase: How have the approval rules for new automated processes changed?
  expected_domains: [business]
  expected_documents: [BUS-2]
  expected_facts: [no longer the only approver]
  forbidden_documents: [BUS-1]

- id: Q15
  purpose: >-
    conflict 6 (same kind, two guides), paraphrased; decided by evidence:
    TEC-3 refers the rollback of a workflow to BUS-7, so BUS-7 wins although
    BUS-4 is newer
  question: >-
    If a new version of our automation misbehaves, can the process owner
    switch back to the old one without asking anyone?
  paraphrase: >-
    Can a process owner revert a workflow to its previous version without
    approval?
  expected_domains: [business]
  expected_documents: [BUS-4, BUS-7]
  expected_facts: [needs no approval]
  conflict:
    claims:
      - document: BUS-4
        text: >-
          If a new version of the workflow misbehaves, a rollback needs the
          approval of your team lead first.
      - document: BUS-7
        text: A rollback is not a change and needs no approval.
    winner: BUS-7

- id: Q16
  purpose: >-
    conflict 7 (same kind, two standards, across domains), paraphrased; no
    other document supports either side, so there is no winner
  question: Can the analyst who built a workflow look at its audit records?
  paraphrase: >-
    Are process analysts allowed to read the audit records of their
    workflows?
  expected_domains: [business, compliance]
  expected_documents: [BUS-6, CMP-7]
  expected_facts: [workflows they assembled, Internal Audit]
  conflict:
    claims:
      - document: BUS-6
        text: >-
          The process analyst reads the audit records of the workflows they
          assembled.
      - document: CMP-7
        text: >-
          Read access to audit records is limited to Compliance, Internal
          Audit, the Data Protection Office and, for their own workflows,
          process owners.
    winner: null

- id: Q17
