# Gold set for the offline evals.
#
# Each question lists the domains the classifier should pick and the
# documents retrieval should return. For an authority conflict both sides
# are expected: the system has to find both before it can decide between
# them. A superseded version is not searched (it is in
# `forbidden_documents`) unless the question asks about history
# (`include_superseded: true`).
# `clearance` is the access level of the person asking (default: internal).
# `paraphrase` asks the same thing in other words; the learning eval uses it
# to check that feedback on a question also helps when it is asked again
# differently.
#
# `conflict` holds the two contradicting claims an agent would write and
# the document whose claim should win (null: no winner).
#
# Questions 1-12 drive the spikes; the full set grows from them.
# Expected answer facts are added later.

- id: Q01
  purpose: test scenario 1 from the assignment
  question: >-
    What's the process for deploying a new microservice and what compliance
    checks are needed?
  paraphrase: >-
    How do we get a new service into production, and which compliance checks
    must it pass first?
  expected_domains: [technical, compliance]
  expected_documents: [TEC-1, TEC-3, CMP-4]

- id: Q02
  purpose: test scenario 2 from the assignment
  question: >-
    How do I troubleshoot API performance issues while following our
    security policies?
  paraphrase: >-
    An API is slow: how do I find the cause without breaking the security
    rules?
  expected_domains: [technical, compliance]
  expected_documents: [TEC-4, TEC-6, CMP-5]

- id: Q03
  purpose: test scenario 3 from the assignment
  question: >-
    What business approvals are required for implementing a new data
    processing workflow?
  paraphrase: >-
    Which sign-offs does a new workflow that processes data need before it
    can start?
  expected_domains: [business, compliance]
  expected_documents: [BUS-2, CMP-1, CMP-2, CMP-6]

- id: Q04
  purpose: versions (conflict 1), paraphrased; only the version in force
  question: Is one sign-off enough to ship a change to production?
  paraphrase: How many approvers does a production release need today?
  expected_domains: [technical]
  expected_documents: [TEC-3]
  forbidden_documents: [TEC-2]

- id: Q05
  purpose: versions (conflict 2), paraphrased; only the version in force
  question: Who must agree before we automate a process that touches customer data?
  paraphrase: >-
    Which approvals does an automation that handles customer data need?
  expected_domains: [business]
  expected_documents: [BUS-2]
  forbidden_documents: [BUS-1]

- id: Q06
  purpose: conflict 3 (authority, across domains), paraphrased
  question: How long can we keep the troubleshooting logs of an API?
  paraphrase: For how many days are the debug logs of an API retained?
  expected_domains: [technical, compliance]
  expected_documents: [CMP-3, TEC-4]
  conflict:
    claims:
      - document: TEC-4
        text: Debug logs are kept for 30 days and then deleted.
      - document: CMP-3
        text: API request logs, including debug logs, are kept for 90 days.
    winner: CMP-3

- id: Q07
  purpose: conflict 4 (authority), literal
  question: Can an experimental connector run in production?
  paraphrase: May a connector from the experimental tier be used in production?
  expected_domains: [business]
  expected_documents: [BUS-3, BUS-4]
  conflict:
    claims:
      - document: BUS-4
        text: >-
          In urgent cases, an experimental connector can be used in
          production with the approval of your team lead.
      - document: BUS-3
        text: Experimental templates and connectors never run in production.
    winner: BUS-3

- id: Q08
  purpose: conflict 5 (authority, across domains), paraphrased
  question: Can my team reuse a connector that another department built?
  paraphrase: Can we use a connector that was built by a different team?
  expected_domains: [technical, business]
  expected_documents: [BUS-3, TEC-5]
  conflict:
    claims:
      - document: TEC-5
        text: >-
          A team-tier connector may also be used by another team if both
          team leads agree.
      - document: BUS-3
        text: >-
          A team item that another team wants to use must first become
          certified.
    winner: BUS-3

- id: Q09
  purpose: the two confidential documents, asked with confidential clearance
  question: Why was the complaint summarisation workflow paused?
  clearance: confidential
  paraphrase: >-
    What went wrong with the complaint summarisation workflow, and why was
    it stopped?
  expected_domains: [business, compliance]
  expected_documents: [CMP-8, BUS-8]

- id: Q10
  purpose: paraphrase only, no keyword from the document title
  question: What should I do if the platform goes down in the middle of the night?
  paraphrase: >-
    Who do I alert when the automation platform has an outage at night?
  expected_domains: [technical]
  expected_documents: [TEC-7]

- id: Q11
  purpose: a fact buried in a long unstructured document (meeting minutes)
  question: Did the board agree to pay for a second robot for sanctions screening?
  paraphrase: >-
    Did the process board approve a second robot for the screening system?
  expected_domains: [business]
  expected_documents: [BUS-9]

- id: Q12
  purpose: a fact buried in a long unstructured document (incident review)
  question: Why did sanctions alert screening fall hours behind at the end of August?
  paraphrase: >-
    What caused the backlog in sanctions alert screening in late August?
  expected_domains: [technical]
  expected_documents: [TEC-9]

- id: Q13
  purpose: history; the superseded version answers it
  question: How many approvers did a production release need in 2025?
  include_superseded: true
  paraphrase: In 2025, how many sign-offs did a release to production require?
  expected_domains: [technical]
  expected_documents: [TEC-2]

- id: Q14
  purpose: what changed between versions, answered by the version in force
  question: What changed in the rules for approving a new automated process?
  paraphrase: How have the approval rules for new automated processes changed?
  expected_domains: [business]
  expected_documents: [BUS-2]
  forbidden_documents: [BUS-1]

- id: Q15
  purpose: >-
    conflict 6 (same kind, two guides), paraphrased; decided by evidence:
    TEC-3 refers the rollback of a workflow to BUS-7, so BUS-7 wins although
    BUS-4 is newer
  question: >-
    If a new version of our automation misbehaves, can the process owner
    switch back to the old one without asking anyone?
  paraphrase: >-
    Can a process owner revert a workflow to its previous version without
    approval?
  expected_domains: [business]
  expected_documents: [BUS-4, BUS-7]
  conflict:
    claims:
      - document: BUS-4
        text: >-
          If a new version of the workflow misbehaves, a rollback needs the
          approval of your team lead first.
      - document: BUS-7
        text: A rollback is not a change and needs no approval.
    winner: BUS-7

- id: Q16
  purpose: >-
    conflict 7 (same kind, two standards, across domains), paraphrased; no
    other document supports either side, so there is no winner
  question: Can the analyst who built a workflow look at its audit records?
  paraphrase: >-
    Are process analysts allowed to read the audit records of their
    workflows?
  expected_domains: [business, compliance]
  expected_documents: [BUS-6, CMP-7]
  conflict:
    claims:
      - document: BUS-6
        text: >-
          The process analyst reads the audit records of the workflows they
          assembled.
      - document: CMP-7
        text: >-
          Read access to audit records is limited to Compliance, Internal
          Audit, the Data Protection Office and, for their own workflows,
          process owners.
    winner: null

- id: Q17
  purpose: coverage of BUS-1, the superseded approval policy; history
  question: Who had to approve a new automated process back in 2025?
  include_superseded: true
  paraphrase: In 2025, whose approval did a new automated process need?
  expected_domains: [business]
  expected_documents: [BUS-1]

- id: Q18
  purpose: coverage of BUS-5, the business case rules
  question: >-
    How long can an automation take to pay for itself before we have to
    justify it?
  paraphrase: >-
    What payback period is acceptable for an automation without a written
    reason?
  expected_domains: [business]
  expected_documents: [BUS-5]

- id: Q19
  purpose: coverage of TEC-8, the architecture overview (public)
  question: Does any part of the automation platform run in the cloud?
  paraphrase: Which parts of the platform are hosted outside our data centres?
  expected_domains: [technical]
  expected_documents: [TEC-8]

# Held-out questions (`heldout: true`): written after every threshold was
# tuned, by a separate model that saw only the document titles, and run
# once with the thresholds frozen. The tuning evals skip them;
# test_heldout.py reports them on their own.

- id: Q20
  purpose: held-out; "website" in the question, "screens" in TEC-5
  heldout: true
  question: >-
    A supplier only offers a website, not an API. Can we still connect it to
    one of our automated workflows?
  paraphrase: >-
    Can a workflow work with a vendor system that has a web page but no API?
  expected_domains: [technical]
  expected_documents: [TEC-5]

- id: Q21
  purpose: held-out; what the analyst finds out before automating
  heldout: true
  question: >-
    A department wants me to automate a process with lots of exceptions. What
    should I find out from them before passing the work to a developer?
  paraphrase: >-
    Before I hand a messy process with many special cases to a developer,
    what do I need to learn from the department?
  expected_domains: [business]
  expected_documents: [BUS-4]

- id: Q22
  purpose: held-out; two compliance documents, secrets and run records
  heldout: true
  question: >-
    Our workflow needs an API key to connect to a vendor's system. How should
    we protect the key, and what details should we keep from each run?
  paraphrase: >-
    Where do we store a vendor's API key for a workflow, and what must be
    recorded every time the workflow runs?
  expected_domains: [compliance]
  expected_documents: [CMP-5, CMP-7]

- id: Q23
  purpose: held-out; a change to a live workflow, two domains
  heldout: true
  question: >-
    The owner wants to change a decision rule in a live workflow before a
    major campaign. Who should be involved, and what needs to happen before
    the change goes live?
  paraphrase: >-
    We need to adjust a threshold in a running automation ahead of a
    campaign. Who approves it and what are the steps to release it?
  expected_domains: [business, technical]
  expected_documents: [BUS-7, TEC-3]

- id: Q24
  purpose: held-out; no document answers it, the system should say so
  heldout: true
  question: >-
    Can the platform calculate monthly staff bonuses from sales figures and
    send the results directly to Payroll?
  paraphrase: >-
    Could an automation work out employee bonuses from sales numbers and
    pass them straight to Payroll?
  expected_domains: []
  expected_documents: []

- id: Q25
  purpose: >-
    held-out; two domains; CMP-3 sets no period for copies of ID documents,
    so the right answer says the rules do not set one
  heldout: true
  question: >-
    We want to trial a workflow that copies customer ID documents for manual
    review. Who needs to approve the trial, and how long can we keep those
    copies?
  paraphrase: >-
    For a pilot that stores copies of customers' identity documents for a
    person to check, whose approval do we need and what is the retention
    period?
  expected_domains: [business, compliance]
  expected_documents: [BUS-2, CMP-1, CMP-3]
