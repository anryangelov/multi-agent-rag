# Gold set for the offline evals.
#
# Each question lists the domains the classifier should pick and the
# documents retrieval should return. For an authority conflict both sides
# are expected: the system has to find both before it can decide between
# them. A superseded version is not searched (it is in
# `forbidden_documents`) unless the question asks about history
# (`include_superseded: true`).
# `clearance` is the access level of the person asking (default: internal).
# `paraphrase` asks the same thing in other words; the learning eval uses it
# to check that feedback on a question also helps when it is asked again
# differently.
#
# `conflict` holds the two contradicting claims an agent would write and
# the document whose claim should win (null: no winner).
#
# `expected_facts` are short phrases from the expected documents that a
# right answer states. Offline they are looked for in the chunks the agents
# kept (was the fact retrieved?); with a model, a judge checks the answer.
#
# Questions 1-12 drove the spikes; the full set grew from them.

- id: Q01
  purpose: test scenario 1 from the assignment
  question: >-
    What's the process for deploying a new microservice and what compliance
    checks are needed?
  paraphrase: >-
    How do we get a new service into production, and which compliance checks
    must it pass first?
  expected_domains: [technical, compliance]
  expected_documents: [TEC-1, TEC-3, CMP-4]
  expected_facts: [two approvers, Pre-Production Compliance Checklist]

- id: Q02
  purpose: test scenario 2 from the assignment
  question: >-
    How do I troubleshoot API performance issues while following our
    security policies?
  paraphrase: >-
    An API is slow: how do I find the cause without breaking the security
    rules?
  expected_domains: [technical, compliance]
  expected_documents: [TEC-4, TEC-6, CMP-5]
  expected_facts: [sort the spans of slow requests by duration, masked before it is written]

- id: Q03
  purpose: test scenario 3 from the assignment
  question: >-
    What business approvals are required for implementing a new data
    processing workflow?
  paraphrase: >-
    Which sign-offs does a new workflow that processes data need before it
    can start?
  expected_domains: [business, compliance]
  expected_documents: [BUS-2, CMP-1, CMP-2, CMP-6]
  expected_facts: [Process Board, pseudonymised]

- id: Q04
  purpose: versions (conflict 1), paraphrased; only the version in force
  question: Is one sign-off enough to ship a change to production?
  paraphrase: How many approvers does a production release need today?
  expected_domains: [technical]
  expected_documents: [TEC-3]
  expected_facts: [two approvers]
  forbidden_documents: [TEC-2]

- id: Q05
  purpose: versions (conflict 2), paraphrased; only the version in force
  question: Who must agree before we automate a process that touches customer data?
  paraphrase: >-
    Which approvals does an automation that handles customer data need?
  expected_domains: [business]
  expected_documents: [BUS-2]
  expected_facts: [Process Board]
  forbidden_documents: [BUS-1]

- id: Q06
  purpose: conflict 3 (authority, across domains), paraphrased
  question: How long can we keep the troubleshooting logs of an API?
  paraphrase: For how many days are the debug logs of an API retained?
  expected_domains: [technical, compliance]
  expected_documents: [CMP-3, TEC-4]
  expected_facts: [90 days]
  conflict:
    claims:
      - document: TEC-4
        text: Debug logs are kept for 30 days and then deleted.
      - document: CMP-3
        text: API request logs, including debug logs, are kept for 90 days.
    winner: CMP-3

- id: Q07
  purpose: conflict 4 (authority), literal
  question: Can an experimental connector run in production?
  paraphrase: May a connector from the experimental tier be used in production?
  expected_domains: [business]
  expected_documents: [BUS-3, BUS-4]
  expected_facts: [never run in production]
  conflict:
    claims:
      - document: BUS-4
        text: >-
          In urgent cases, an experimental connector can be used in
          production with the approval of your team lead.
      - document: BUS-3
        text: Experimental templates and connectors never run in production.
    winner: BUS-3

- id: Q08
  purpose: conflict 5 (authority, across domains), paraphrased
  question: Can my team reuse a connector that another department built?
  paraphrase: Can we use a connector that was built by a different team?
  expected_domains: [technical, business]
  expected_documents: [BUS-3, TEC-5]
  expected_facts: [must first become certified]
  conflict:
    claims:
      - document: TEC-5
        text: >-
          A team-tier connector may also be used by another team if both
          team leads agree.
      - document: BUS-3
        text: >-
          A team item that another team wants to use must first become
          certified.
    winner: BUS-3

- id: Q09
  purpose: the two confidential documents, asked with confidential clearance
  question: Why was the complaint summarisation workflow paused?
  clearance: confidential
  paraphrase: >-
    What went wrong with the complaint summarisation workflow, and why was
    it stopped?
  expected_domains: [business, compliance]
  expected_documents: [CMP-8, BUS-8]
  expected_facts: [Nothing was pseudonymised]

- id: Q10
